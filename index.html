<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Just A Race Team - Random Upgrade Racing"
    >

    <title>Just A Race Team</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="app">


        <!-- ==================================================
             HEADER / LOGO AREA
             ================================================== -->

        <header class="hero">

            <p class="eyebrow">
                RANDOM UPGRADE RACING
            </p>

            <h1>
                JUST A RACE TEAM
            </h1>

            <p class="subtitle">
                Race. Finish. Upgrade. Repeat.
            </p>

        </header>



        <!-- ==================================================
             HOME SCREEN
             ================================================== -->

        <section id="homeScreen">


            <section class="game-card">


                <!-- PLAYER NAME -->

                <div class="game-section">

                    <label
                        for="playerNameInput"
                        class="input-label"
                    >
                        YOUR NAME
                    </label>


                    <input
                        id="playerNameInput"
                        type="text"
                        maxlength="20"
                        placeholder="PLAYER NAME"
                        autocomplete="off"
                    >


                    <p
                        id="homeMessage"
                        class="message"
                    ></p>

                </div>



                <!-- CREATE GAME -->

                <div class="divider">

                    <span>
                        CREATE
                    </span>

                </div>


                <div class="game-section">

                    <h2>
                        Create a Game
                    </h2>


                    <p>
                        Start a new room and invite your friends.
                    </p>


                    <button
                        id="createGameBtn"
                        class="primary-button"
                        type="button"
                    >
                        Create Game
                    </button>

                </div>



                <!-- JOIN GAME -->

                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>


                <div class="game-section">

                    <h2>
                        Join a Game
                    </h2>


                    <p>
                        Enter the room code from the host.
                    </p>


                    <input
                        id="roomCodeInput"
                        type="text"
                        maxlength="5"
                        placeholder="ROOM CODE"
                        autocomplete="off"
                        spellcheck="false"
                    >


                    <button
                        id="joinGameBtn"
                        class="secondary-button"
                        type="button"
                    >
                        Join Game
                    </button>

                </div>


            </section>

        </section>



        <!-- ==================================================
             LOBBY SCREEN
             ================================================== -->

        <section
            id="lobbyScreen"
            class="hidden"
        >


            <section class="game-card lobby-card">


                <!-- LOBBY HEADER -->

                <div class="lobby-header">


                    <div>

                        <p class="eyebrow">
                            GAME LOBBY
                        </p>


                        <h2>

                            Room

                            <span id="lobbyRoomCode">
                                -----
                            </span>

                        </h2>

                    </div>



                    <button
                        id="leaveGameBtn"
                        class="small-button"
                        type="button"
                    >
                        Leave
                    </button>


                </div>



                <!-- CURRENT PLAYER -->

                <div class="lobby-meta">

                    <span>
                        YOU ARE PLAYING AS
                    </span>


                    <strong id="lobbyPlayerName">
                        Player
                    </strong>

                </div>



                <!-- PLAYER LIST -->

                <div class="lobby-section">

                    <h3>
                        Players
                    </h3>


                    <div
                        id="playerList"
                        class="player-list"
                    >
                    </div>

                </div>



                <!-- LOBBY STATUS -->

                <p
                    id="lobbyNote"
                    class="lobby-note"
                >
                    Waiting for players...
                </p>



                <!-- START GAME -->

                <button
                    id="startGameBtn"
                    class="primary-button"
                    type="button"
                >
                    Start Game
                </button>


            </section>

        </section>



        <!-- ==================================================
             FOOTER
             ================================================== -->

        <footer>

            Just A Race Team

        </footer>


    </main>



    <!-- ======================================================
         JAVASCRIPT
         ====================================================== -->

    <script
        type="module"
        src="script.js"
    ></script>


</body>

</html>
